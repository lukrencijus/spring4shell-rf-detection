<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="ISO-8859-1">
    <title>Student Tracker</title>
    <link rel="stylesheet" 
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" 
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" 
          crossorigin="anonymous">
</head>
<body>
    <div class="container my-2">
        <h1>Students List</h1>
        
        <a th:href="@{/students/add}" class="btn btn-primary btn-sm mb-3">
            Add Student
        </a>
        
        <table border="1" class="table table-striped table-responsive-md">
            <thead>
                <tr>
                    <th>
                        <a th:href="@{'/students/page/' + ${currentPage} + '?sortField=firstName&sortDir=' + ${reverseSortDir}}">
                            First Name
                        </a>
                    </th>
                    <th>
                        <a th:href="@{'/students/page/' + ${currentPage} + '?sortField=lastName&sortDir=' + ${reverseSortDir}}">
                            Last Name
                        </a>
                    </th>
                    <th>
                        <a th:href="@{'/students/page/' + ${currentPage} + '?sortField=studentId&sortDir=' + ${reverseSortDir}}">
                            Student ID
                        </a>
                    </th>
                    <th>
                        <a th:href="@{'/students/page/' + ${currentPage} + '?sortField=major&sortDir=' + ${reverseSortDir}}">
                            Major
                        </a>
                    </th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${listStudents}">
                    <td th:text="${student.firstName}"></td>
                    <td th:text="${student.lastName}"></td>
                    <td th:text="${student.studentId}"></td>
                    <td th:text="${student.major}"></td>
                    <td>
                        <a th:href="@{/students/update/{id}(id=${student.id})}" 
                           class="btn btn-primary">Update</a>
                        <a th:href="@{/students/delete/{id}(id=${student.id})}" 
                           class="btn btn-danger">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div th:if="${totalPages > 1}">
            <div class="row col-sm-10">
                <div class="col-sm-5">
                    Total Rows: [[${totalItems}]]
                </div>
                <div class="col-sm-3">
                    <span th:each="i: ${#numbers.sequence(1, totalPages)}">
                        <a th:if="${currentPage != i}" 
                           th:href="@{'/students/page/' + ${i}+ '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}">
                            [[${i}]]
                        </a>
                        <span th:unless="${currentPage != i}">[[${i}]]</span>
                        &nbsp; &nbsp;
                    </span>
                </div>
                <div class="col-sm-1">
                    <a th:if="${currentPage < totalPages}" 
                       th:href="@{'/students/page/' + ${currentPage + 1}+ '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}">
                        Next
                    </a>
                    <span th:unless="${currentPage < totalPages}">Next</span>
                </div>
                <div class="col-sm-1">
                    <a th:if="${currentPage < totalPages}" 
                       th:href="@{'/students/page/' + ${totalPages}+ '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}">
                        Last
                    </a>
                    <span th:unless="${currentPage < totalPages}">Last</span>
                </div>
            </div>
        </div>
        
        <hr>
        <a th:href="@{/}">Back to Courses</a>
    </div>
</body>
</html>
