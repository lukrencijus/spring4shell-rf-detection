<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="ISO-8859-1">
    <title>Department Tracker</title>
    <link rel="stylesheet" 
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" 
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" 
          crossorigin="anonymous">
</head>
<body>
    <div class="container my-2">
        <h1>Departments List</h1>
        
        <a th:href="@{/departments/add}" class="btn btn-primary btn-sm mb-3">
            Add Department
        </a>
        
        <table border="1" class="table table-striped table-responsive-md">
            <thead>
                <tr>
                    <th>
                        <a th:href="@{'/departments/page/' + ${currentPage} + '?sortField=departmentName&sortDir=' + ${reverseSortDir}}">
                            Department Name
                        </a>
                    </th>
                    <th>
                        <a th:href="@{'/departments/page/' + ${currentPage} + '?sortField=building&sortDir=' + ${reverseSortDir}}">
                            Building
                        </a>
                    </th>
                    <th>
                        <a th:href="@{'/departments/page/' + ${currentPage} + '?sortField=email&sortDir=' + ${reverseSortDir}}">
                            Email
                        </a>
                    </th>
                    <th>
                        <a th:href="@{'/departments/page/' + ${currentPage} + '?sortField=headOfDepartment&sortDir=' + ${reverseSortDir}}">
                            Head of Department
                        </a>
                    </th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="department : ${listDepartments}">
                    <td th:text="${department.departmentName}"></td>
                    <td th:text="${department.building}"></td>
                    <td th:text="${department.email}"></td>
                    <td th:text="${department.headOfDepartment}"></td>
                    <td>
                        <a th:href="@{/departments/update/{id}(id=${department.id})}" 
                           class="btn btn-primary">Update</a>
                        <a th:href="@{/departments/delete/{id}(id=${department.id})}" 
                           class="btn btn-danger">Delete</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div th:if="${totalPages > 1}">
            <div class="row col-sm-10">
                <div class="col-sm-5">
                    Total Rows: [[${totalItems}]]
                </div>
                <div class="col-sm-3">
                    <span th:each="i: ${#numbers.sequence(1, totalPages)}">
                        <a th:if="${currentPage != i}" 
                           th:href="@{'/departments/page/' + ${i}+ '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}">
                            [[${i}]]
                        </a>
                        <span th:unless="${currentPage != i}">[[${i}]]</span>
                        &nbsp; &nbsp;
                    </span>
                </div>
                <div class="col-sm-1">
                    <a th:if="${currentPage < totalPages}" 
                       th:href="@{'/departments/page/' + ${currentPage + 1}+ '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}">
                        Next
                    </a>
                    <span th:unless="${currentPage < totalPages}">Next</span>
                </div>
                <div class="col-sm-1">
                    <a th:if="${currentPage < totalPages}" 
                       th:href="@{'/departments/page/' + ${totalPages}+ '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}">
                        Last
                    </a>
                    <span th:unless="${currentPage < totalPages}">Last</span>
                </div>
            </div>
        </div>
        
        <hr>
        <a th:href="@{/}">Back to Courses</a> | 
        <a th:href="@{/students/}">Manage Students</a>
    </div>
</body>
</html>
