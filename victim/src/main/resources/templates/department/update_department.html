<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org/">
<head>
    <meta charset="ISO-8859-1">
    <title>Department Tracker</title>
    <link rel="stylesheet" 
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1>Department Tracker</h1>
        <hr>
        <h2>Update Department</h2>
        
        <form action="#" th:action="@{/departments/save}" th:object="${department}" method="POST">
            <input type="hidden" th:field="*{id}" />
            
            <input type="text" 
                   th:field="*{departmentName}" 
                   class="form-control mb-4 col-4" 
                   placeholder="Department Name">
            
            <input type="text" 
                   th:field="*{building}" 
                   class="form-control mb-4 col-4" 
                   placeholder="Building">
            
            <input type="text" 
                   th:field="*{email}" 
                   class="form-control mb-4 col-4" 
                   placeholder="Department Email">
            
            <input type="text" 
                   th:field="*{headOfDepartment}" 
                   class="form-control mb-4 col-4" 
                   placeholder="Head of Department">
            
            <button type="submit" class="btn btn-info col-2">Update Department</button>
        </form>
        
        <hr>
        <a th:href="@{/departments/}">Back to Department List</a>
    </div>
</body>
</html>
